[project]
name = "nucleo-viewer-backend"
version = "0.1.0"
description = "Local backend for the case-001 CT mask viewer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydicom>=3.0",
    "nibabel>=5.2",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "ASYNC"]
